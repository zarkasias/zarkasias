name: Update metrics

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:
  push:
    paths: ["scripts/metrics.mjs", ".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate SVGs
        env:
          # METRICS_TOKEN (optional) is a personal access token so private repos count toward
          # languages and repo totals. Falls back to the built-in token (public data only).
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node scripts/metrics.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/
          git diff --staged --quiet || (git commit -m "Update metrics" && git push)
